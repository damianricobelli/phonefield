name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    environment: main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace
        run: pnpm lint

      - name: Typecheck phonefield package
        run: pnpm --filter ./packages/phonefield typecheck

      - name: Test phonefield package
        run: pnpm --filter ./packages/phonefield test

      - name: Build workspace and verify package
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          version-script: pnpm ci:version
          publish-script: pnpm ci:release
          commit-message: "chore: new release"
          pr-title: "chore: new release"
